<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DoctorBangla24</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a clinic front desk. Sticky header, one 1120px column; views swap in place.
   The prescription pad is the one "paper" object on the site, everything else stays flat. */
:root {
  --bg: #f2f6f4;
  --surface: #ffffff;
  --surface-2: #e7efeb;
  --ink: #13231e;
  --muted: #586a64;
  --line: #d3dfd9;
  --accent: #0c6a56;
  --accent-ink: #ffffff;
  --accent-soft: #d7ebe3;
  --rx: #b13e1c;
  --pad: #fffdf6;
  --pad-line: #e8dfc9;
  --ok: #157a3c;
  --ok-soft: #dcf2e3;
  --warn: #946200;
  --warn-soft: #fbefd2;
  --bad: #b42323;
  --bad-soft: #fbe1e1;
  --stage: #0f1c18;
  --stage-ink: #e6efeb;
  --shadow: 0 1px 2px rgb(19 35 30 / .06), 0 8px 24px rgb(19 35 30 / .06);
  --f-body: "Hind Siliguri", "Noto Sans Bengali", "Nirmala UI", system-ui, sans-serif;
  --f-display: "Noto Serif Bengali", "Hind Siliguri", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1613; --surface: #15201c; --surface-2: #1b2924; --ink: #e3ece8; --muted: #9aafa7;
    --line: #2a3a34; --accent: #4fc3a1; --accent-ink: #052219; --accent-soft: #19362d; --rx: #f08b65;
    --pad: #1a231f; --pad-line: #33413a; --ok: #5fd08c; --ok-soft: #173826; --warn: #e5b44c; --warn-soft: #3a2f14;
    --bad: #f08080; --bad-soft: #3d1c1c; --stage: #08100d; --stage-ink: #e6efeb;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1613; --surface: #15201c; --surface-2: #1b2924; --ink: #e3ece8; --muted: #9aafa7;
  --line: #2a3a34; --accent: #4fc3a1; --accent-ink: #052219; --accent-soft: #19362d; --rx: #f08b65;
  --pad: #1a231f; --pad-line: #33413a; --ok: #5fd08c; --ok-soft: #173826; --warn: #e5b44c; --warn-soft: #3a2f14;
  --bad: #f08080; --bad-soft: #3d1c1c; --stage: #08100d; --stage-ink: #e6efeb;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.65;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.3; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); }
h2 { font-size: clamp(1.35rem, 3vw, 1.75rem); }
h3 { font-size: 1.12rem; }
p { margin: 0; }
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mono { font-family: var(--f-mono); font-size: .88em; letter-spacing: .02em; }
.muted { color: var(--muted); }
.eyebrow { font-size: .8rem; font-weight: 600; letter-spacing: .06em; color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Header */
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.head-row { display: flex; align-items: center; gap: 16px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex-shrink: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-family: var(--f-mono); font-size: .85rem; }
.brand b { font-size: 1.05rem; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: .74rem; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a { white-space: nowrap; text-decoration: none; color: var(--muted); padding: 6px 11px; border-radius: 8px; font-weight: 500; font-size: .95rem; }
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a.on { color: var(--accent); background: var(--accent-soft); }
.who { flex-shrink: 0; font-size: .82rem; display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.doc { background: var(--accent-soft); color: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.online::before, .pill.chamber::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.online { background: var(--accent-soft); color: var(--accent); }
.demo-band { background: var(--warn-soft); color: var(--warn); font-size: .82rem; }
.demo-band .wrap { padding-block: 5px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
@media (max-width: 760px) {
  .head-row { flex-wrap: wrap; gap: 8px 12px; }
  .nav { order: 3; flex-basis: 100%; }
  .who { margin-left: auto; }
}

/* Buttons + forms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; font-size: .96rem; cursor: pointer; text-decoration: none; line-height: 1.3; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.sm { padding: 5px 11px; font-size: .85rem; border-radius: 7px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
label { font-size: .88rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
input, select, textarea { width: 100%; font: inherit; font-size: .98rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
textarea { resize: vertical; min-height: 84px; line-height: 1.55; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field { min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.section { padding-block: 40px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
main { min-height: 60vh; }
.page-head { padding-block: 32px 8px; display: flex; flex-direction: column; gap: 6px; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 36px; padding-block: 44px 28px; align-items: start; }
.hero-id { display: flex; gap: 18px; align-items: center; margin-bottom: 14px; }
.portrait { width: 84px; height: 84px; border-radius: 50%; flex-shrink: 0; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-size: 2rem; font-weight: 700; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.degrees { color: var(--muted); font-weight: 500; }
.lede { font-size: 1.08rem; max-width: 60ch; margin-block: 14px 22px; }
.facts { display: flex; gap: 28px; flex-wrap: wrap; margin: 26px 0 0; padding-top: 18px; border-top: 1px solid var(--line); }
.facts div { display: flex; flex-direction: column; }
.facts dt { font-size: .8rem; color: var(--muted); order: 2; }
.facts dd { margin: 0; font-weight: 700; font-size: 1.3rem; font-family: var(--f-display); }
.queue { box-shadow: var(--shadow); }
.queue h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.q-line { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding-block: 14px; border-bottom: 1px dashed var(--line); }
.q-line:last-of-type { border-bottom: 0; }
.q-line strong { font-size: 1.05rem; }
.q-next { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; color: var(--accent); text-align: right; }
.meter { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 24px; } }
.services { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.service { padding: 22px; display: flex; flex-direction: column; gap: 8px; }
.service + .service { border-left: 1px solid var(--line); }
.fee { font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; }
.fee small { font-family: var(--f-body); font-size: .85rem; color: var(--muted); font-weight: 500; }
@media (max-width: 760px) { .services { grid-template-columns: 1fr; } .service + .service { border-left: 0; border-top: 1px solid var(--line); } }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; color: var(--muted); font-weight: 600; letter-spacing: .03em; background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.nowrap { white-space: nowrap; }

/* Blog */
.posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.post-card { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
.post-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.post-card h3 { font-size: 1.15rem; }
.post-card p { color: var(--muted); font-size: .95rem; }
.post-meta { display: flex; gap: 8px; align-items: center; font-size: .82rem; color: var(--muted); flex-wrap: wrap; }
.tag { font-size: .78rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 9px; border-radius: 99px; }
.article { max-width: 70ch; margin: 0 auto; padding-block: 34px 50px; }
.article h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); margin-block: 10px 12px; }
.article .body { display: flex; flex-direction: column; gap: 16px; font-size: 1.07rem; margin-top: 26px; }
.byline { display: flex; align-items: center; gap: 12px; padding-block: 14px; border-block: 1px solid var(--line); }
.byline .portrait { width: 44px; height: 44px; font-size: 1.1rem; border-width: 2px; }
.note { font-size: .9rem; background: var(--surface-2); border-radius: 8px; padding: 12px 14px; color: var(--muted); }

/* Booking */
.steps { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; padding-block: 10px 50px; align-items: start; }
@media (max-width: 880px) { .steps { grid-template-columns: 1fr; } }
.step-title { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.step-no { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .82rem; font-weight: 700; flex-shrink: 0; }
.choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.choice button { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; font: inherit; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.choice button small { color: var(--muted); }
.choice button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.day { flex: 0 0 auto; min-width: 70px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; font: inherit; color: var(--ink); cursor: pointer; text-align: center; line-height: 1.3; }
.day small { display: block; color: var(--muted); font-size: .76rem; }
.day b { font-size: 1.1rem; }
.day[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.day[aria-pressed="true"] small { color: inherit; opacity: .85; }
.day:disabled { opacity: .4; cursor: not-allowed; text-decoration: line-through; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.slot { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 6px; font: inherit; font-size: .9rem; color: var(--ink); cursor: pointer; }
.slot[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.slot:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; text-decoration: line-through; }
.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); display: flex; flex-direction: column; gap: 12px; }
.sum-row { display: flex; justify-content: space-between; gap: 12px; font-size: .95rem; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
.sum-row span:first-child { color: var(--muted); }
.sum-row span:last-child { text-align: right; font-weight: 600; }
.ticket { border: 2px dashed var(--accent); border-radius: 14px; padding: 24px; background: var(--surface); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 520px; margin: 30px auto 60px; }
.ticket .big { font-family: var(--f-display); font-size: 3rem; font-weight: 700; color: var(--accent); line-height: 1; }
.ticket .id { font-family: var(--f-mono); font-size: 1.15rem; background: var(--surface-2); padding: 4px 12px; border-radius: 6px; }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); }

/* Consultation room */
.room { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; padding-block: 16px 50px; align-items: start; }
.room.no-video { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
@media (max-width: 960px) { .room, .room.no-video { grid-template-columns: 1fr; } }
.stage { position: relative; background: var(--stage); color: var(--stage-ink); border-radius: 14px; aspect-ratio: 16 / 10; max-width: 100%; overflow: hidden; display: grid; place-items: center; }
.stage .avatar { width: 108px; height: 108px; border-radius: 50%; background: rgb(255 255 255 / .1); display: grid; place-items: center; font-family: var(--f-display); font-size: 2.4rem; font-weight: 700; position: relative; }
.stage .avatar::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid rgb(79 195 161 / .6); animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.18); opacity: 0; } }
.stage .who-name { position: absolute; left: 14px; bottom: 12px; font-size: .9rem; background: rgb(0 0 0 / .45); padding: 2px 10px; border-radius: 6px; }
.stage .timer { position: absolute; left: 14px; top: 12px; font-family: var(--f-mono); font-size: .85rem; background: rgb(0 0 0 / .45); padding: 2px 10px; border-radius: 6px; display: flex; gap: 6px; align-items: center; }
.stage .timer::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
.self { position: absolute; right: 12px; bottom: 12px; width: 26%; aspect-ratio: 4 / 3; max-width: 100%; background: #1f2f29; border-radius: 10px; border: 2px solid rgb(255 255 255 / .2); display: grid; place-items: center; overflow: hidden; font-size: .78rem; color: #b9cbc4; }
.self video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.controls { display: flex; justify-content: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.ctl { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.ctl svg { width: 20px; height: 20px; }
.ctl.off { background: var(--surface-2); color: var(--bad); }
.ctl.end { background: var(--bad); color: #fff; border-color: var(--bad); width: auto; padding: 0 18px; border-radius: 999px; font: inherit; font-weight: 600; }
.chat { display: flex; flex-direction: column; height: 360px; padding: 0; overflow: hidden; }
.chat-head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 82%; padding: 7px 12px; border-radius: 12px; font-size: .94rem; background: var(--surface-2); align-self: flex-start; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
.msg.sys { align-self: center; background: transparent; color: var(--muted); font-size: .82rem; text-align: center; }
.msg time { display: block; font-size: .72rem; opacity: .7; }
.chat form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.chips { display: flex; gap: 6px; padding: 8px 10px 0; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 2px 10px; font: inherit; font-size: .8rem; cursor: pointer; }
.chip:hover { color: var(--accent); border-color: var(--accent); }

/* Prescription writer */
.rx-writer { display: flex; flex-direction: column; gap: 16px; }
.rx-writer h3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.rx-sym { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 700; color: var(--rx); font-size: 1.6rem; line-height: 1; }
.med-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, .9fr) auto; gap: 6px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.med-row input:first-child { grid-column: 1 / -2; font-weight: 600; }
.med-row .x { grid-column: -2 / -1; grid-row: 1; }
.med-row input { padding: 7px 9px; font-size: .92rem; }
.med-row .x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1.2rem; padding: 6px; line-height: 1; }
.med-row .x:hover { color: var(--bad); }
.med-head { display: none; }

/* Prescription paper */
.pad { background: var(--pad); border: 1px solid var(--pad-line); border-radius: 6px; box-shadow: var(--shadow); max-width: 860px; margin: 0 auto; color: var(--ink); }
.pad-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; padding: 24px 28px 18px; border-bottom: 3px double var(--accent); }
.pad-head h2 { font-size: 1.35rem; color: var(--accent); }
.pad-head .en { font-family: Georgia, serif; text-align: right; }
.pad-head .en h2 { font-family: Georgia, serif; }
.pad-head p { font-size: .88rem; color: var(--muted); }
.pad-pt { display: flex; flex-wrap: wrap; gap: 6px 26px; padding: 10px 28px; border-bottom: 1px solid var(--pad-line); font-size: .93rem; }
.pad-pt b { font-weight: 600; }
.pad-body { display: grid; grid-template-columns: minmax(0, 34%) minmax(0, 1fr); min-height: 420px; }
.pad-left { padding: 20px 22px 20px 28px; border-right: 1px solid var(--pad-line); display: flex; flex-direction: column; gap: 18px; font-size: .92rem; }
.pad-left h4, .pad-right h4 { margin: 0 0 4px; font-size: .78rem; letter-spacing: .08em; color: var(--accent); font-family: "IBM Plex Mono", "Hind Siliguri", monospace; font-weight: 600; }
.pad-left ul, .pad-right ul { margin: 0; padding-left: 18px; }
.pad-right { padding: 20px 28px; display: flex; flex-direction: column; gap: 20px; }
.pad-meds { list-style: none; padding: 0 !important; display: flex; flex-direction: column; gap: 12px; counter-reset: med; }
.pad-meds li { counter-increment: med; display: grid; grid-template-columns: 26px 1fr; }
.pad-meds li::before { content: counter(med) "."; font-weight: 600; color: var(--muted); }
.pad-meds .mname { font-weight: 600; font-size: 1.02rem; }
.pad-meds .mdose { font-size: .93rem; color: var(--muted); }
.pad-meds .mdose b { color: var(--ink); font-weight: 600; letter-spacing: .04em; }
.pad-foot { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; padding: 16px 28px 22px; border-top: 1px solid var(--pad-line); font-size: .85rem; color: var(--muted); }
.sign { text-align: center; min-width: 180px; }
.sign .scrawl { font-family: Georgia, serif; font-style: italic; font-size: 1.4rem; color: var(--accent); }
.sign .line { border-top: 1px solid var(--muted); padding-top: 2px; }
@media (max-width: 640px) {
  .pad-head { grid-template-columns: 1fr; padding: 18px; }
  .pad-head .en { text-align: left; }
  .pad-pt, .pad-foot { padding-left: 18px; padding-right: 18px; }
  .pad-body { grid-template-columns: 1fr; }
  .pad-left { border-right: 0; border-bottom: 1px solid var(--pad-line); padding: 18px; }
  .pad-right { padding: 18px; }
}

/* Doctor panel */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; margin-bottom: 20px; }
.tabs button { border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--muted); padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
.stat { padding: 16px; }
.stat b { display: block; font-family: var(--f-display); font-size: 1.9rem; line-height: 1.2; }
.stat span { color: var(--muted); font-size: .86rem; }
@media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.login { max-width: 420px; margin: 50px auto; display: flex; flex-direction: column; gap: 14px; }
.hint { font-size: .86rem; background: var(--accent-soft); color: var(--accent); padding: 8px 12px; border-radius: 8px; }
.err { color: var(--bad); font-size: .88rem; }
.list-item { display: flex; justify-content: space-between; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.list-item:last-child { border-bottom: 0; }
.list-item > div { min-width: 0; }

/* Footer, toast */
footer { border-top: 1px solid var(--line); background: var(--surface); margin-top: 20px; }
footer .wrap { padding-block: 26px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; font-size: .9rem; color: var(--muted); }
footer b { color: var(--ink); }
@media (max-width: 720px) { footer .wrap { grid-template-columns: 1fr; } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 500; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

/* ---------- language ---------- */

const MONTHS = { bn: ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"],

const DAYS_SHORT = { bn: ["রবি", "সোম", "মঙ্গল", "বুধ", "বৃহঃ", "শুক্র", "শনি"], en: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] };
const pad2 = n => String(n).padStart(2, "0");

}
const nowHM = () => { const d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };

const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function slotsFor(date, type) {
  if (parseD(date).getDay() === 5) return [];
  const s = SCHEDULE[type], out = [];
  let [h, m] = s.start.split(":").map(Number);
  const [eh, em] = s.end.split(":").map(Number);
  while (h * 60 + m < eh * 60 + em) { out.push(pad2(h) + ":" + pad2(m)); m += s.step; if (m >= 60) { h++; m -= 60; } }
  return out;
}
const isPast = (date, hm) => date < today() || (date === today() && hm <= nowHM());

/* ---------- store ---------- */
const KEY = "db24-demo-v2";
function seed() {
  const tday = today(), y = ymd(dayAt(-1)), tm = ymd(dayAt(1)), ago = n => ymd(dayAt(-n));
  return {
    v: 2, nextAppt: 1006, nextRx: 5002, nextPost: 5,
    posts: [
      { id: "p1", date: ago(3), cat: { bn: "সংক্রামক রোগ", en: "Infectious disease" },
        title: { bn: "ডেঙ্গু জ্বরে কখন হাসপাতালে যাবেন", en: "Dengue: when to go to the hospital" },
        excerpt: { bn: "জ্বর কমে যাওয়ার পরের ২৪ থেকে ৪৮ ঘণ্টাই সবচেয়ে ঝুঁকিপূর্ণ। কোন লক্ষণ দেখলে দেরি করবেন না, জেনে নিন।", en: "The 24 to 48 hours after the fever drops are the riskiest. Learn the warning signs that mean you should not wait." },
        body: { bn: "ডেঙ্গু জ্বরে বেশিরভাগ রোগী বাড়িতে বিশ্রাম, পর্যাপ্ত পানি ও প্যারাসিটামল খেয়েই সেরে ওঠেন। কিন্তু একটি ভুল ধারণা খুব প্রচলিত: জ্বর চলে গেলেই বিপদ কেটে গেছে। আসলে জ্বর কমে যাওয়ার পরের এক থেকে দুই দিনকে বলা হয় ক্রিটিক্যাল ফেজ, এই সময়েই রক্তনালী থেকে প্লাজমা বেরিয়ে যেতে পারে।\n\nযেসব লক্ষণ দেখলে দেরি না করে হাসপাতালে যাবেন: পেটে তীব্র ব্যথা, বারবার বমি, মাড়ি বা নাক দিয়ে রক্ত পড়া, কালো পায়খানা, অস্থিরতা বা অতিরিক্ত ঘুম ঘুম ভাব, হাত-পা ঠান্ডা হয়ে যাওয়া, এবং ছয় ঘণ্টার বেশি প্রস্রাব না হওয়া।\n\nডেঙ্গুতে ব্যথার ওষুধ হিসেবে শুধু প্যারাসিটামল নিন। আইবুপ্রোফেন, ডাইক্লোফেনাক বা অ্যাসপিরিন জাতীয় ওষুধ রক্তক্ষরণের ঝুঁকি বাড়ায়। প্রাপ্তবয়স্কদের দিনে আড়াই থেকে তিন লিটার তরল, যেমন খাবার স্যালাইন, ডাবের পানি, স্যুপ ও ফলের রস নিন।\n\nজ্বরের প্রথম দিনেই NS1 পরীক্ষা এবং ডাক্তারের পরামর্শে নির্দিষ্ট বিরতিতে CBC করে প্লাটিলেট ও হেমাটোক্রিট দেখা জরুরি। শুধু প্লাটিলেট সংখ্যা দেখে আতঙ্কিত হবেন না, হেমাটোক্রিট বাড়ছে কি না সেটিও সমান গুরুত্বপূর্ণ।",
          en: "Most people with dengue recover at home with rest, plenty of fluids and paracetamol. But one belief is common and wrong: that the danger is over once the fever goes. The one to two days after the fever drops are the critical phase, when plasma can leak out of the blood vessels.\n\nGo to the hospital without delay if you notice severe abdominal pain, repeated vomiting, bleeding from the gums or nose, black stools, restlessness or unusual drowsiness, cold hands and feet, or no urine for more than six hours.\n\nUse only paracetamol for pain in dengue. Ibuprofen, diclofenac and aspirin raise the risk of bleeding. Adults should take two and a half to three litres of fluid a day: oral saline, coconut water, soup and fruit juice.\n\nAn NS1 test on the first day of fever and a CBC at the intervals your doctor advises are important for tracking platelets and haematocrit. Don't panic over the platelet count alone; a rising haematocrit matters just as much." } },
      { id: "p2", date: ago(8), cat: { bn: "হৃদরোগ ও প্রেশার", en: "Heart & blood pressure" },
        title: { bn: "উচ্চ রক্তচাপ: বাড়িতে প্রেশার মাপার সঠিক নিয়ম", en: "High blood pressure: measuring it correctly at home" },
        excerpt: { bn: "ভুল ভঙ্গিতে মাপলে রিডিং ১০ থেকে ১৫ পয়েন্ট পর্যন্ত বেশি আসতে পারে। পাঁচটি সহজ নিয়ম মানলেই ফল নির্ভরযোগ্য হবে।", en: "A poor posture can push a reading 10 to 15 points too high. Follow five simple rules and your numbers become reliable." },
        body: { bn: "অনেক রোগী চেম্বারে এসে বলেন, বাসায় প্রেশার মাপলে একেক সময় একেক রকম আসে। বেশিরভাগ ক্ষেত্রে সমস্যা মেশিনে নয়, মাপার পদ্ধতিতে।\n\nমাপার আগে অন্তত পাঁচ মিনিট চুপচাপ বসে বিশ্রাম নিন। আধা ঘণ্টার মধ্যে চা, কফি, ধূমপান বা ব্যায়াম করবেন না। পিঠ হেলান দিয়ে চেয়ারে বসুন, পা মাটিতে সমান রাখুন, পায়ের উপর পা তুলবেন না।\n\nহাত টেবিলের উপর এমনভাবে রাখুন যেন কাফটি হৃৎপিণ্ডের সমান উচ্চতায় থাকে। কাফ সরাসরি চামড়ার উপর বাঁধুন, জামার হাতার উপর নয়। মাপার সময় কথা বলবেন না।\n\nএক মিনিট বিরতি দিয়ে দুবার মাপুন এবং দুটোর গড় লিখে রাখুন। সকালে ওষুধ খাওয়ার আগে ও রাতে, টানা এক সপ্তাহ এভাবে লিখে ফলো-আপে নিয়ে আসলে ওষুধের ডোজ ঠিক করা অনেক সহজ হয়। বাসায় মাপা রিডিং বারবার ১৩৫/৮৫ এর বেশি হলে তা উচ্চ রক্তচাপ নির্দেশ করে।",
          en: "Many patients tell me their home readings jump around. Most of the time the problem is not the machine but how the reading is taken.\n\nSit quietly for at least five minutes before measuring. Avoid tea, coffee, smoking and exercise for half an hour beforehand. Sit with your back supported, feet flat on the floor, legs uncrossed.\n\nRest your arm on a table so the cuff is level with your heart. Wrap the cuff on bare skin, not over a sleeve. Don't talk while measuring.\n\nTake two readings one minute apart and write down the average. Do this every morning before your medicine and every evening for a week, and bring the log to your follow-up; it makes adjusting the dose much easier. Home readings that are repeatedly above 135/85 indicate high blood pressure." } },

}
function wireAppt(root) {
  $$("[data-confirm]", root).forEach(b => b.onclick = () => { appt(b.dataset.confirm).status = "confirmed"; save(); toast(t("অ্যাপয়েন্টমেন্ট নিশ্চিত করা হয়েছে", "Appointment confirmed")); viewDoctor(); });
  $$("[data-cancel]", root).forEach(b => b.onclick = () => armButton(b, t("বাতিল", "Cancel"), () => {
    appt(b.dataset.cancel).status = "cancelled"; save(); toast(t("অ্যাপয়েন্টমেন্ট বাতিল করা হয়েছে", "Appointment cancelled")); viewDoctor();
  }));
}
function tabToday(body, todays) {
  const nextUp = todays.find(a => a.status === "confirmed");
  body.innerHTML = `${nextUp ? `<div class="card row between" style="margin-bottom:16px;border-color:var(--accent)">
      <div><p class="eyebrow">${t("পরবর্তী রোগী", "Next patient")}</p><b style="font-size:1.1rem">${esc(loc(nextUp.name))}</b> <span class="muted">· ${fmtTime(nextUp.time)} · ${esc(loc(nextUp.problem))}</span></div>
      <a class="btn primary" href="#room-${nextUp.id}">${nextUp.type === "online" ? t("ভিডিও কল শুরু করুন", "Start video call") : t("প্রেসক্রিপশন লিখুন", "Write prescription")}</a></div>` : ""}
    ${apptRows(todays, false)}`;
  wireAppt(body);
}
function tabAppts(body) {
  const td = today();
  const filters = [["upcoming", t("আসন্ন", "Upcoming")], ["pending", t("অপেক্ষমাণ", "Pending")], ["completed", t("সম্পন্ন", "Completed")], ["all", t("সব", "All")]];
  const list = S.appointments.filter(a => apFilter === "all" ? true : apFilter === "upcoming" ? a.date >= td && (a.status === "pending" || a.status === "confirmed") : a.status === apFilter)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) * (apFilter === "completed" ? -1 : 1));
  body.innerHTML = `<div class="row" style="margin-bottom:14px">${filters.map(([k, l]) => `<button class="chip" type="button" data-f="${k}" style="${apFilter === k ? chipOn : ""}">${l}</button>`).join("")}</div>${apptRows(list, true)}`;
  $$("[data-f]", body).forEach(b => b.onclick = () => { apFilter = b.dataset.f; viewDoctor(); });
  wireAppt(body);
}
function tabBlog(body) {
  const posts = S.posts.slice().sort((a, b) => b.date.localeCompare(a.date));
  body.innerHTML = `<div style="display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));align-items:start">
    <form class="card stack" id="post-form">
      <h3>${t("নতুন লেখা", "New article")}</h3>
      <div class="field"><label for="pf-title">${t("শিরোনাম", "Title")}</label><input id="pf-title" placeholder="${t("যেমন: শীতে অ্যাজমা নিয়ন্ত্রণের ৫টি উপায়", "e.g. 5 ways to keep asthma under control in winter")}"></div>
      <div class="field"><label for="pf-cat">${t("বিভাগ", "Category")}</label><input id="pf-cat" list="cat-list" placeholder="${t("যেমন: শ্বাসতন্ত্র", "e.g. Respiratory")}"><datalist id="cat-list">${[...new Set(S.posts.map(p => loc(p.cat)))].map(c => `<option value="${esc(c)}"></option>`).join("")}</datalist></div>
      <div class="field"><label for="pf-body">${t("লেখা (অনুচ্ছেদের মাঝে একটি ফাঁকা লাইন দিন)", "Text (leave a blank line between paragraphs)")}</label><textarea id="pf-body" rows="9"></textarea></div>
      <p class="err" id="pf-err" hidden></p>
      <button class="btn primary" type="submit">${t("প্রকাশ করুন", "Publish")}</button>
    </form>
    <div class="card"><h3>${t("প্রকাশিত লেখা", "Published articles")} (${num(posts.length)})</h3>
      ${posts.map(p => `<div class="list-item"><div><a href="#post-${esc(p.id)}"><b>${esc(loc(p.title))}</b></a><div class="muted" style="font-size:.85rem">${esc(loc(p.cat))} · ${fmtDate(p.date)}</div></div><button class="btn sm danger" type="button" data-delpost="${esc(p.id)}">${t("মুছুন", "Delete")}</button></div>`).join("") || `<p class="empty">${t("এখনো কোনো লেখা নেই।", "No articles yet.")}</p>`}
    </div></div>`;
  $("#post-form").onsubmit = e => {
    e.preventDefault();
    const title = $("#pf-title").value.trim(), cat = $("#pf-cat").value.trim() || t("সাধারণ", "General"), text = $("#pf-body").value.trim();
    if (!title || text.length < 20) { const er = $("#pf-err"); er.textContent = t("শিরোনাম ও অন্তত কয়েক লাইনের লেখা দিন।", "Add a title and at least a few lines of text."); er.hidden = false; return; }
    const first = text.split(/\n\s*\n/)[0].replace(/\s+/g, " ");
    const id = "p" + S.nextPost++;
    S.posts.push({ id, date: today(), cat, title, excerpt: first.length > 140 ? first.slice(0, 138) + "…" : first, body: text });
    save(); toast(t("লেখা প্রকাশিত হয়েছে", "Article published")); location.hash = "#post-" + id;
  };
  $$("[data-delpost]", body).forEach(b => b.onclick = () => armButton(b, t("মুছুন", "Delete"), () => {
    S.posts = S.posts.filter(p => p.id !== b.dataset.delpost); save(); toast(t("লেখা মুছে ফেলা হয়েছে", "Article deleted")); viewDoctor();
  }));
}
function tabRxs(body) {
  const list = S.prescriptions.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  body.innerHTML = !list.length ? `<p class="empty">${t("এখনো কোনো প্রেসক্রিপশন দেওয়া হয়নি।", "No prescriptions issued yet.")}</p>` : `<div class="table-wrap"><table>
    <thead><tr><th>${t("নং", "No.")}</th><th>${t("তারিখ", "Date")}</th><th>${t("রোগী", "Patient")}</th><th>${t("রোগ নির্ণয়", "Diagnosis")}</th><th>${t("ওষুধ", "Medicines")}</th><th></th></tr></thead><tbody>
    ${list.map(r => `<tr><td class="mono">${r.id}</td><td class="nowrap">${fmtDate(r.date)}</td><td><b>${esc(loc(r.patient.name))}</b><div class="muted" style="font-size:.8rem">${yrs(r.patient.age)}, ${gName(r.patient.gender)}</div></td><td>${esc(loc(r.dx))}</td><td>${t(bn(r.meds.length) + "টি", String(r.meds.length))}</td>
    <td class="nowrap"><a class="btn sm" href="#rx-${r.id}">${t("দেখুন", "View")}</a> <a class="btn sm ghost" href="#room-${r.apptId}">${t("সম্পাদনা", "Edit")}</a></td></tr>`).join("")}
    </tbody></table></div>`;
}

/* ---------- boot ---------- */
$("#lang-btn").onclick = () => {
  lang = lang === "bn" ? "en" : "bn";
  try { localStorage.setItem("db24-lang", lang); } catch (e) {}
  renderShell(); route();
};
$("#reset-demo").onclick = e => {
  const b = e.currentTarget;
  if (!b.classList.contains("armed")) {
    b.classList.add("armed"); b.textContent = t("আবার চাপুন, সব নতুন করে শুরু হবে", "Press again to start fresh");
    setTimeout(() => { b.classList.remove("armed"); b.textContent = t("ডেমো ডেটা রিসেট", "Reset demo data"); }, 3500);
    return;
  }
  b.classList.remove("armed"); b.textContent = t("ডেমো ডেটা রিসেট", "Reset demo data");
  S = seed(); save(); bk = null; toast(t("ডেমো ডেটা নতুন করে সাজানো হয়েছে", "Demo data restored")); route();
};
renderShell();
route();
})();
</script>
</body>
</html>
